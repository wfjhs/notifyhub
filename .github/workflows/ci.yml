name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 33 个单测都是纯逻辑 + Mockito，不依赖 MySQL / Redis
      - name: Test and package
        run: mvn -B -f pom.xml --no-transfer-progress package

      - name: Upload executable jar
        uses: actions/upload-artifact@v4
        with:
          name: notifyhub-jar
          path: target/notifyhub-1.0.0.jar
          if-no-files-found: warn

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
